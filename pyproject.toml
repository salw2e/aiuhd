[project]
name = "aiuhd"
version = "0.1.0"
description = "Upscale and enhance photos and videos locally"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch", "spandrel", "pillow", "numpy", "opencv-python-headless",
    "diffusers>=0.33.1", "peft>=0.17.0", "gguf", "rotary_embedding_torch>=0.5.3", "omegaconf>=2.3.0", "einops", "safetensors",
    "psutil", "tqdm", "matplotlib"]

[project.scripts]
aiuhd = "aiuhd.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiuhd"]
